{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Islom Nurmukhammadov{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'style/base.css' %}?v=6" />
    <link rel="stylesheet" href="{% static 'style/animations.css' %}" />
    <link rel="stylesheet" href="{% static 'style/mobile/basemobile.css' %}?v=6">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    {% block extra_css %}{% endblock extra_css %}
  </head>
  <body>
    <header>
      <a href="{% url 'home' %}">Islom Nurmukhammadov's blog</a>
      <ul>
        <li><a href="{% url 'blog' %}">Blog</a></li>
        <li><a href="{% url 'solutions' %}">Solutions</a></li>
      </ul>
    </header>

    {% block content %} {% endblock content %}
  </body>
</html>
